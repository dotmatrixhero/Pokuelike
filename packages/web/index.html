<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokuelike</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10141a;
        --panel: #171c24;
        --panel-2: #1b2129;
        --panel-border: #2a303c;
        --text: #e8eaed;
        --text-dim: #8b93a1;
        --accent: #4a8cff;
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      button, input, select {
        font-family: inherit;
        font-size: 13px;
        background: #20262f;
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        padding: 5px 9px;
      }
      button { cursor: pointer; }
      button:hover { background: #2a313d; }
      button.playing { background: var(--accent); color: #06111f; border-color: var(--accent); }
      input[type="number"] { width: 110px; }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 10px;
        gap: 10px;
      }

      /* ================= Top bar =================
         Direct ask: "UI is a bit rough... rethink UX." Slimmed from the
         original single long wrapping row (which held playback, seed,
         style, zoom, tick/clock, auto camera, and BOTH map-mode toggles all
         at once) down to identity + the map-mode switch + a status readout
         + a couple of persistent controls, with everything else tucked into
         the overflow menu (#more-menu below). Playback itself moved off the
         header entirely — see the floating HUD in #map-area. */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        position: relative;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header .subtitle { color: var(--text-dim); font-size: 11px; }
      .divider { width: 1px; height: 20px; background: var(--panel-border); }
      .field-group { display: flex; align-items: center; gap: 4px; }
      #tick-label, #clock-label { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 12px; }
      #zoom-label { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 13px; }
      #auto-cam-toggle.playing { background: #c792ea; color: #1a0e24; border-color: #c792ea; }

      .icon-btn { display: flex; align-items: center; gap: 6px; }
      .icon-btn svg { flex: 0 0 auto; }

      /* Seed chip — condenses the old 3-button field-group into one clickable
         summary that expands its controls on demand, so it doesn't cost a
         permanent slice of header width. */
      #seed-chip-wrap { position: relative; }
      #seed-chip { background: var(--panel-2); }
      #seed-popover {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 45;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      /* An author `display` declaration always outranks the UA stylesheet's
         plain `[hidden] { display: none }`, same footgun `.force-hide`'s own
         comment below describes for canvas-wrap/macro-map-wrap — needs an
         explicit override here too. */
      #seed-popover[hidden] { display: none; }

      /* Map-mode segmented switch — replaces the old separate "Overworld:
         Off/On" + "Show Zone View" buttons with one clear two-state control. */
      .segmented {
        display: flex;
        background: var(--panel-2);
        border: 1px solid var(--panel-border);
        border-radius: 7px;
        padding: 2px;
        gap: 2px;
      }
      .segmented button {
        border: none;
        border-radius: 5px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        background: transparent;
        color: var(--text-dim);
      }
      .segmented button:hover { background: rgba(255, 255, 255, 0.04); }
      /* Same specificity as `.segmented button` above (one class + one
         type each) — without the extra `.playing` class here, source order
         alone would decide the winner instead of state, and this rule
         happens to lose that way. Two classes explicitly outranks it. */
      .segmented button.playing { background: var(--accent); color: #06111f; }
      .segmented button.playing:hover { background: var(--accent); }

      /* Overflow menu — the rarer controls (seed reroll, style, zoom, flat
         mode) that don't need permanent header real estate. */
      #more-menu-wrap { position: relative; }
      #more-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 45;
        display: none;
        flex-direction: column;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 12px;
        min-width: 220px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #more-menu.open { display: flex; }
      #more-menu .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      #more-menu .menu-label { font-size: 12px; color: var(--text-dim); }

      main {
        flex: 1;
        display: flex;
        gap: 10px;
        min-height: 0;
      }

      /* ================= Map area =================
         Holds whichever of the macro/zone canvases is active, plus floating
         overlay chrome (playback HUD, mini-map corner widget, auto-camera
         badge) positioned absolutely so they never scroll away with the
         canvas underneath them. */
      #map-area {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #canvas-wrap {
        flex: 1;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 8px;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y;
      }
      /* Author-origin declarations always outrank the browser's own default
         `[hidden] { display: none }` regardless of selector specificity, so
         #canvas-wrap and #macro-map-wrap's own unconditional `display: flex`
         above would silently defeat the plain `hidden` attribute. The
         Overworld-mode view toggle (main.ts) uses this `!important` class
         instead, which — same-origin, higher importance tier — reliably wins. */
      .force-hide { display: none !important; }

      /* The overworld macro grid — ONE pannable/zoomable canvas covering the
         whole grid (thousands of zone-cells), not a strip of cards. */
      #macro-map-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
      }
      #macro-map-hint { color: var(--text-dim); font-size: 12px; }
      #macro-map-scroll {
        flex: 1;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 8px;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y;
      }
      #macro-map-canvas { display: block; }
      canvas { image-rendering: pixelated; cursor: pointer; border-radius: 3px; }

      /* --- Floating playback HUD ---------------------------------------
         Direct ask: "make pause and play floating buttons." Docked over the
         map itself (not the header) so it's reachable regardless of which
         panel tab or map mode is showing, and reads as a media-player
         control rather than one more toolbar row. */
      #playback-hud {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(23, 28, 36, 0.94);
        border: 1px solid var(--panel-border);
        border-radius: 30px;
        padding: 6px 14px 6px 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #play-pause {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: #06111f;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #play-pause:not(.playing) { background: var(--panel-2); color: var(--text); border: 1px solid var(--panel-border); }
      #play-pause svg { pointer-events: none; }
      #step {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #speed { width: 90px; accent-color: var(--accent); }
      #speed-label { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-dim); }

      /* --- Mini-map corner widget --------------------------------------
         A quick jump between the zoomed-in zone and the overworld without a
         trip back to the header's segmented switch. A simplified static
         thumbnail (not a live-rendered copy of the macro grid) — the real
         detail lives one click away. */
      #minimap-widget {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 20;
        text-align: center;
      }
      #minimap-widget button {
        display: block;
        width: 108px;
        height: 78px;
        padding: 0;
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
      }
      #minimap-widget .minimap-caption {
        font-size: 9.5px;
        color: var(--text-dim);
        margin-top: 4px;
      }
      .minimap-zone-art {
        position: absolute;
        inset: 0;
        background:
          repeating-conic-gradient(#2e4a33 0% 25%, #35532f 0% 50%) 0 0/16px 16px;
      }
      .minimap-overworld-art {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(90deg, #2b3a2c 0 11px, #263424 11px 22px),
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1) 0 11px, transparent 11px 22px);
      }
      .minimap-marker { position: absolute; border: 2px solid #ffb238; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }

      /* --- Auto-camera status badge -------------------------------------
         Only meaningfully visible while Auto Camera is actually following
         something — main.ts's frame() loop toggles the `hidden` attribute
         directly alongside setting the status text. */
      #auto-cam-badge {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 7px;
        background: rgba(23, 28, 36, 0.92);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 6px 12px 6px 8px;
        max-width: min(360px, 60%);
      }
      #auto-cam-badge[hidden] { display: none; }
      #auto-cam-badge .auto-cam-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18); flex: 0 0 auto; }
      #auto-cam-status { font-size: 11.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Both floating overlays sit relative to the whole #map-area, but the
         macro-map view has its own toolbar row (zoom + hint) above the
         canvas that they'd otherwise overlap — push them down only while
         that toolbar is the thing showing (mirrors the same `:not([hidden])
         :not(.force-hide)` visibility check main.ts's `applyOverworldSubView`
         drives). */
      #macro-map-wrap:not([hidden]):not(.force-hide) ~ #auto-cam-badge,
      #macro-map-wrap:not([hidden]):not(.force-hide) ~ #minimap-widget {
        top: 54px;
      }

      /* ================= Unified side panel =================
         Direct ask: rethink logs/battle log/inspector/map navigation so
         they're "easier to navigate." Inspector, Battle, Events and Legend
         used to live in two different places — a docked tab pair under the
         map, and an off-canvas drawer that had to be discovered via a
         hamburger button. One panel, always in the same spot, four tabs. */
      #side-panel {
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        overflow: hidden;
        min-height: 0;
        transition: flex-basis 0.15s ease, opacity 0.15s ease;
      }
      #side-panel.panel-collapsed {
        flex-basis: 0;
        min-width: 0;
        opacity: 0;
        border-width: 0;
        pointer-events: none;
      }
      #panel-tabs {
        display: flex;
        border-bottom: 1px solid var(--panel-border);
        flex: 0 0 auto;
      }
      .panel-tab-btn {
        flex: 1;
        padding: 10px 4px;
        font-size: 11.5px;
        font-weight: 600;
        border: none;
        border-radius: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--text-dim);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .panel-tab-btn:hover { background: rgba(255, 255, 255, 0.04); }

      /* ---- Chronicle ---- */
      #chronicle-page { padding: 10px 12px 24px; overflow-y: auto; }
      .chron-intro { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
      .chron-empty { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 18px 4px; }
      .chron-herd, .chron-notable {
        border-left: 2px solid rgba(255, 255, 255, 0.08);
        padding: 0 0 0 12px;
        margin: 0 0 20px;
      }
      .chron-herd h3, .chron-notable h3 {
        margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; color: var(--text);
      }
      .chron-sub { font-size: 11px; color: var(--muted); margin: 3px 0 9px; font-variant-numeric: tabular-nums; }
      .chron-alive { color: #8fd6a0; }
      .chron-dead { color: #e8737d; }
      .chron-beats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .chron-beats li {
        display: grid;
        grid-template-columns: 18px 42px 1fr;
        align-items: baseline;
        gap: 6px;
        font-size: 12.5px;
        line-height: 1.5;
        padding-left: 6px;
        border-left: 2px solid var(--beat);
      }
      .chron-icon { font-size: 11px; line-height: 1.4; }
      .chron-tick { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
      .chron-text b { color: var(--beat); font-weight: 650; }
      .chron-untold { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 7px; padding-left: 8px; }
      .chron-notables-head {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em;
        color: var(--muted); font-weight: 600; margin: 26px 0 14px; padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .chron-notable { border-left-color: #d9a5f0; }
      .chron-notable-label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #d9a5f0; font-weight: 700;
      }
      .chron-tale { margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--text); }
      .chron-before { margin-top: 7px; font-size: 11px; color: var(--muted); line-height: 1.5; }
      .panel-tab-btn.playing { color: var(--text); border-bottom-color: var(--accent); background: transparent; }
      #panel-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--panel-border);
      }
      #panel-body { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
      #panel-body.panel-expanded { flex-basis: auto; }
      #events-page { display: flex; flex-direction: column; height: 100%; }
      /* Each of the four tab pages below sets its own unconditional
         `display` (needed either way for its internal layout) — an author
         `display` declaration always beats the UA stylesheet's plain
         `[hidden] { display: none }` regardless of selector specificity, so
         the inactive tab's page needs an explicit, equally-specific
         override here or toggling `hidden` in main.ts's `selectTab` would do
         nothing visually. */
      #inspector[hidden], #battle-screen[hidden], #events-page[hidden], #legend[hidden] { display: none; }

      /* Battle Screen — styled like a mainline Pokémon battle text box. */
      #battle-screen { padding: 10px 14px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; height: 100%; }
      .battle-screen-empty { color: var(--text-dim); padding: 10px 4px; font-size: 12px; }
      .battle-screen-vs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .battle-screen-combatant {
        flex: 1 1 160px;
        min-width: 130px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        border-left: 3px solid transparent;
        padding-left: 6px;
      }
      .battle-screen-combatant-ident { display: flex; align-items: center; gap: 5px; }
      .battle-screen-sprite { width: 20px; height: 20px; image-rendering: pixelated; flex: 0 0 auto; }
      .battle-screen-name { font-weight: 700; font-size: 13px; }
      .battle-screen-hp-track { height: 7px; border-radius: 4px; background: #232a34; overflow: hidden; }
      .battle-screen-hp-fill { height: 100%; border-radius: 4px; transition: width 0.25s ease; }
      .battle-screen-hp-value { font-size: 10.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
      .battle-screen-vs-label { flex: 0 0 auto; color: var(--text-dim); font-weight: 700; font-size: 12px; }
      .battle-screen-extra { flex: 0 0 auto; color: var(--text-dim); font-size: 11px; }
      .battle-screen-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border-top: 1px solid var(--panel-border);
        padding-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      .battle-screen-line { line-height: 1.4; }
      .battle-screen-line-intro, .battle-screen-line-scene { font-weight: 700; color: var(--text); }
      .battle-screen-line-move { color: var(--text); }
      .battle-screen-line-crit { color: #ff6b6b; font-weight: 700; }
      .battle-screen-line-effective { color: #7be08a; font-weight: 700; }
      .battle-screen-line-notvery { color: var(--text-dim); font-style: italic; }
      .battle-screen-line-damage { color: #ff9d3c; font-weight: 600; }
      .battle-screen-line-miss { color: var(--text-dim); font-style: italic; }
      .battle-screen-line-retreat { color: #6ec6ff; }
      .battle-screen-line-faint { color: #f5d76e; font-weight: 700; }
      .battle-screen-line-conclusion { color: #ff6b6b; font-weight: 700; }
      .battle-screen-line-newest { animation: battle-flash 0.5s ease-out; }
      @keyframes battle-flash {
        from { background: rgba(255, 107, 107, 0.35); }
        to { background: transparent; }
      }
      #battle-screen.battle-screen-concluded .battle-screen-vs { opacity: 0.7; }

      #legend { padding: 10px 14px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
      .legend-group-title { color: var(--text-dim); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.05em; margin-bottom: 3px; }
      .legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 3px 8px; }
      .legend-item { display: flex; align-items: center; gap: 5px; }
      .legend-glyph { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-weight: 700; width: 1.4em; text-align: center; flex: 0 0 auto; }
      .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

      /* --- Events tab: compact filter chips + log ---------------------
         Direct ask: the old three always-visible checkbox+sentence-label
         rows took a full wrapping header row of their own. Same three
         filters, as small toggle chips instead. */
      #event-filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--panel-border); flex: 0 0 auto; }
      .filter-chip {
        display: flex;
        align-items: center;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 12px;
        background: var(--panel-2);
        border: 1px solid var(--panel-border);
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }
      .filter-chip.chip-active { background: var(--accent); border-color: var(--accent); color: #06111f; font-weight: 600; }
      .filter-chip input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
      #event-log {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 6px 14px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .log-row { display: flex; gap: 6px; padding: 1px 2px; border-radius: 3px; }
      .log-row-minor { color: var(--text-dim); }
      .log-row-story { font-weight: 600; padding: 2px; }
      .log-icon { flex: 0 0 auto; width: 1.3em; text-align: center; }
      .log-tick { flex: 0 0 auto; color: var(--text-dim); font-weight: 400; }
      .log-row-story .log-tick { color: inherit; opacity: 0.7; }
      .log-text { flex: 1; word-break: break-word; }
      .log-empty, .log-note, .inspect-empty {
        color: var(--text-dim);
        padding: 10px 4px;
        font-size: 12px;
      }

      #inspector { padding: 10px 14px; font-size: 12.5px; }
      .inspect-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
      .inspect-row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px dashed #232a34; }
      .inspect-label { color: var(--text-dim); }
      .inspect-value { text-align: right; }
      #inspector .inspect-row { justify-content: flex-start; }
      #inspector .inspect-label { flex: 0 0 auto; min-width: 130px; }
      #inspector .inspect-value { text-align: left; }
      #inspector .inspect-row.inspect-row-compact { gap: 6px; }
      #inspector .inspect-row.inspect-row-compact .inspect-label { min-width: 0; }

      .inspect-group {
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 7px 9px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.015);
      }
      .inspect-group-title {
        color: var(--text-dim);
        text-transform: uppercase;
        font-size: 10.5px;
        letter-spacing: 0.05em;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .inspect-group .inspect-row { border-bottom: none; padding: 1px 0; }

      .inspect-identity-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
      .type-chip, .inspect-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        color: #0a0d12;
        text-transform: capitalize;
      }
      .inspect-chip { background: #262c37; color: var(--text); text-transform: none; }
      .inspect-sex { font-size: 15px; font-weight: 700; line-height: 1; padding: 0 2px; cursor: default; }
      .inspect-sex-male { color: #4a8cff; }
      .inspect-sex-female { color: #ff6fae; }

      .inspect-meter-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
      .inspect-meter-label { flex: 0 0 auto; min-width: 76px; font-size: 11.5px; color: var(--text-dim); }
      .inspect-meter-track {
        flex: 1;
        height: 7px;
        border-radius: 4px;
        background: #232a34;
        overflow: hidden;
      }
      .inspect-meter-fill { height: 100%; border-radius: 4px; }
      .inspect-meter-value { flex: 0 0 auto; min-width: 34px; text-align: right; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

      .move-list { display: flex; flex-direction: column; gap: 3px; }
      .move-row { border-bottom: 1px dashed #232a34; padding-bottom: 3px; }
      .move-row:last-child { border-bottom: none; }
      .move-row-header { display: flex; align-items: center; gap: 7px; padding: 3px 2px; border-radius: 4px; flex-wrap: wrap; }
      .move-row-clickable { cursor: pointer; }
      .move-row-clickable:hover { background: rgba(255, 255, 255, 0.04); }
      .move-row-clickable:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
      .move-type-swatch { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
      .move-name { font-weight: 600; }
      .move-summary { color: var(--text-dim); font-size: 11px; }
      .move-use-count { color: var(--text-dim); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
      .move-caret { color: var(--text-dim); font-size: 10px; width: 1em; text-align: center; }

      .skilltree {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 8px 4px 6px 18px;
        margin-top: 2px;
        border-left: 2px solid var(--panel-border);
      }
      .skilltree-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .skilltree-node {
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 4px 8px;
        min-width: 84px;
        background: #1b2129;
        cursor: default;
      }
      .skilltree-node-dim { opacity: 0.45; }
      .skilltree-node-chosen { opacity: 1; background: #232b1f; }
      .skilltree-node-name { font-size: 11.5px; font-weight: 600; }
      .skilltree-node-cost { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

      /* Narrow viewports: stack the map above the panel instead of side by
         side, and give the panel a bounded height rather than splitting the
         row evenly. */
      @media (max-width: 900px) {
        main { flex-direction: column; }
        #side-panel { flex: 0 0 auto; max-height: 42vh; }
        #side-panel.panel-collapsed { max-height: 0; }
      }
      @media (max-width: 768px) {
        #macro-map-zoom-in, #macro-map-zoom-out, #zoom-in, #zoom-out, #minimap-widget button {
          min-width: 44px;
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <h1>Pokuelike</h1>
          <span class="subtitle">live observer</span>
        </div>

        <div id="seed-chip-wrap">
          <button id="seed-chip" class="icon-btn" title="Seed">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="seed-chip-label"></span>
          </button>
          <div id="seed-popover" hidden>
            <label for="seed-input" class="inspect-label" style="color: var(--text-dim); font-size: 12px;">Seed</label>
            <input id="seed-input" type="number" step="1" />
            <button id="load-seed">Load</button>
            <button id="random-seed" title="Mint a fresh random seed and load it">Random</button>
            <button id="copy-seed" title="Copy the current seed to the clipboard">Copy</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="segmented" role="group" aria-label="Map mode">
          <button id="map-mode-zone" class="playing" title="The focused zone's detailed tile view">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 5px;"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Zone
          </button>
          <button id="map-mode-overworld" title="The whole macro grid — several regions, only the focused one fully simulated">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 5px;"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.8 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.8-4-9s1.5-6.4 4-9z"/></svg>
            Overworld
          </button>
        </div>

        <div class="divider"></div>
        <span id="tick-label"></span>
        <span id="clock-label"></span>

        <div style="flex: 1;"></div>

        <button id="auto-cam-toggle" class="icon-btn" title="Follow notable events automatically — immigration, courtship/eggs, hatching, battles, evolution, deaths — zooming in and slowing down while each one plays out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.5 -2.5v9l-4.5 -2.5"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
          Auto Camera
        </button>

        <div id="more-menu-wrap">
          <button id="more-menu-toggle" title="Style, zoom, flat mode" aria-haspopup="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div id="more-menu">
            <div class="menu-row">
              <span class="menu-label">Render style</span>
              <div class="field-group">
                <button id="style-tile" class="playing">Tile</button>
                <button id="style-ascii">ASCII</button>
              </div>
            </div>
            <div class="menu-row">
              <span class="menu-label">Zoom</span>
              <div class="field-group">
                <button id="zoom-out" title="Zoom out">&minus;</button>
                <span id="zoom-label"></span>
                <button id="zoom-in" title="Zoom in">+</button>
              </div>
            </div>
            <div class="menu-row">
              <span class="menu-label" title="A separate, simpler simulation with no macro grid/regions — a fallback, not the everyday view">Flat mode (no regions)</span>
              <button id="overworld-toggle" title="Switch between the overworld (regions + migration) and one plain flat map">Overworld: On</button>
            </div>
          </div>
        </div>

        <button id="toggle-panel" title="Show/hide the side panel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </header>

      <main>
        <div id="map-area">
          <div id="macro-map-wrap" hidden>
            <div id="macro-map-toolbar" style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px;">
              <div class="field-group">
                <button id="macro-map-zoom-out" title="Zoom out">&minus;</button>
                <span id="macro-map-zoom-label"></span>
                <button id="macro-map-zoom-in" title="Zoom in">+</button>
              </div>
              <span id="macro-map-hint">Click a zone to focus/promote it</span>
            </div>
            <div id="macro-map-scroll">
              <canvas id="macro-map-canvas"></canvas>
            </div>
          </div>
          <div id="canvas-wrap">
            <canvas id="scene"></canvas>
          </div>

          <div id="auto-cam-badge" hidden>
            <span class="auto-cam-dot"></span>
            <span id="auto-cam-status"></span>
          </div>

          <div id="minimap-widget">
            <button id="minimap-button" title="Jump to the other map view">
              <span id="minimap-art-zone" class="minimap-zone-art">
                <span class="minimap-marker" style="left: 38%; top: 30%; width: 22%; height: 30%;"></span>
              </span>
              <span id="minimap-art-overworld" class="minimap-overworld-art" hidden>
                <span class="minimap-marker" style="left: 42%; top: 34%; width: 18%; height: 26%;"></span>
              </span>
            </button>
            <div id="minimap-caption" class="minimap-caption">overworld</div>
          </div>

          <div id="playback-hud">
            <button id="play-pause" title="Play/Pause">
              <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 4.5v15l13-7.5z"/></svg>
              <svg id="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <button id="step" title="Advance exactly one tick (pauses first)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l10-7.5z"/><rect x="17" y="5" width="3" height="14" rx="1"/></svg>
            </button>
            <div class="divider"></div>
            <input id="speed" type="range" step="1" />
            <span id="speed-label"></span>
          </div>
        </div>

        <div class="panel" id="side-panel">
          <div id="panel-tabs" role="tablist">
            <button id="tab-inspector" class="panel-tab-btn playing" role="tab" aria-selected="true" title="Population stats and per-agent detail">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
              Inspector
            </button>
            <button id="tab-battle-screen" class="panel-tab-btn" role="tab" aria-selected="false" title="Pokémon-battle-textbox view of whatever Auto Camera is following">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/><path d="M4 4l3 1 -1 3-3-1z"/><path d="M20 4l-3 1 1 3 3-1z"/></svg>
              Battle
            </button>
            <button id="tab-events" class="panel-tab-btn" role="tab" aria-selected="false" title="The scrolling world event log">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
              Events
            </button>
            <button id="tab-chronicle" class="panel-tab-btn" role="tab" aria-selected="false" title="The story of each herd — foundings, migrations, disasters, splits — and the world's notables">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
              Chronicle
            </button>
            <button id="tab-legend" class="panel-tab-btn" role="tab" aria-selected="false" title="What every glyph/color on the map means">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
              Legend
            </button>
          </div>

          <div id="panel-toolbar">
            <button id="expand-panel" title="Expand this panel for easier reading, especially on mobile">&#10530;</button>
            <button id="clear-selection" title="Clear selection">Clear</button>
          </div>

          <div id="panel-body">
            <div id="inspector" data-panel-page></div>
            <div id="battle-screen" data-panel-page hidden></div>
            <div id="events-page" data-panel-page hidden>
              <div id="event-filters">
                <label class="filter-chip" id="chip-hide-noise">
                  <input id="hide-noise" type="checkbox" checked />
                  Pokémon only
                </label>
                <label class="filter-chip" id="chip-hide-levelups">
                  <input id="hide-levelups" type="checkbox" checked />
                  Hide level-ups
                </label>
                <label class="filter-chip" id="chip-headlines-only" title="Only births, true deaths, and evolutions — for watching a long run without every fight/dispersal/shelter event">
                  <input id="headlines-only" type="checkbox" />
                  Quiet mode
                </label>
              </div>
              <div id="event-log"></div>
            </div>
            <div id="chronicle-page" data-panel-page hidden></div>
            <div id="legend" data-panel-page hidden></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
